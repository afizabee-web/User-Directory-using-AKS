apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgress
  namespace: database
spec:
  serviceName: "postgress"
  podManagementPolicy: OrderedReady
  replicas: 3
  selector:
    matchLabels:
      db: postgress-db
  template:
    metadata: 
      labels:
        db: postgress-db
        azure.workload.identity/use: "true"
    spec:
      terminationGracePeriodSeconds: 10
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "postgres-secrets-kv"
      containers:
      - name: stateful-app-container
        image: postgres:15
        ports:
        - containerPort: 5432
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: postgress-secret
                key: db
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgress-secret
                key: user
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgress-secret
                key: password
          - name: PGDATA
            value: "/var/lib/postgresql/data"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: "managed-csi"   # ← fixed
      resources:
        requests:
          storage: 2Gi