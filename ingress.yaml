
# flask-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
  - host: yourdomain.com      # ← exact domain from GoDaddy
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
      - path: /health      # keep health check
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
# Auto TLS
